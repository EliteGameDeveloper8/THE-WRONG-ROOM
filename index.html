<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Wrong Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--wall:#2a0f3d;--carpet:#0f3b3a;--brass:#ffc83d;--pink:#ff5fa2;--teal:#37d6c4;--cream:#fff4dc;--ink:#1b0a28}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font:800 16px/1.4 Nunito,system-ui,sans-serif;color:var(--cream);background:var(--wall);
 background-image:repeating-linear-gradient(45deg,#ffffff08 0 14px,transparent 14px 28px),linear-gradient(180deg,var(--wall),#3b1450 70%,var(--carpet));
 padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:480px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
h2,h4,.logo,.code b,.b{font-family:'Bagel Fat One',system-ui,sans-serif;font-weight:400}
.logo{font-size:clamp(54px,18vw,84px);line-height:.88;text-align:center;color:var(--brass);text-shadow:4px 4px 0 var(--pink);transform:rotate(-3deg);animation:wob 4s ease-in-out infinite;margin:18px 0 6px}
.sub{text-align:center;opacity:.8;margin:0}
input{font:inherit;padding:14px;border-radius:14px;border:3px solid var(--brass);background:var(--ink);color:var(--cream);width:100%;text-transform:none}
#jc{text-transform:uppercase;letter-spacing:.3em;text-align:center}
.row{display:flex;gap:8px}
.b{font-size:20px;padding:14px 16px;border:0;border-radius:16px;color:var(--ink);box-shadow:0 5px 0 #0006;cursor:pointer;width:100%;transition:transform .1s}
.b:active{transform:translateY(4px);box-shadow:0 1px 0 #0006}.b:disabled{opacity:.4;cursor:not-allowed}
.pink{background:var(--pink)}.teal{background:var(--teal)}.yel{background:var(--brass)}.ghost{background:transparent;color:var(--cream);box-shadow:none;font-size:15px}
.code{text-align:center;background:var(--ink);border:3px dashed var(--brass);border-radius:18px;padding:12px}
.code b{display:block;font-size:56px;letter-spacing:.15em;color:var(--brass)}.code small{opacity:.7}
.cast{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pl{background:var(--ink);border-bottom:6px solid var(--c,#555);border-radius:16px;padding:10px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;font-size:14px;overflow:hidden}
.pl.empty{opacity:.4}.pl .av{font-size:44px;animation:bob 2.4s ease-in-out infinite}.pl i{font-style:normal;font-size:12px}
.pop{animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
.card{background:var(--cream);color:var(--ink);border-radius:20px;padding:14px;box-shadow:6px 6px 0 var(--pink)}
.card h2{margin:0 0 4px;font-size:26px}.card p{margin:4px 0}
.secret{background:var(--ink);border:3px solid var(--pink);border-radius:18px;padding:12px;cursor:pointer}
.secret h4{margin:0 0 6px;color:var(--pink)}.secret small{opacity:.7;font-family:Nunito}.secret p{margin:6px 0}
.secret.blur p{filter:blur(9px);user-select:none}
.bar{height:12px;background:var(--ink);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--pink),var(--brass));transition:width .5s linear}
.top{display:flex;align-items:center;gap:10px}.top span{font-size:22px;font-family:'Bagel Fat One'}
.opts{display:grid;gap:8px}.opt{background:var(--brass);text-align:left}.opt:nth-child(2n){background:var(--teal)}.opt:nth-child(3n){background:var(--pink)}
.chat{background:#0006;border-radius:16px;padding:8px;display:flex;flex-direction:column;gap:6px}
#log{max-height:190px;min-height:70px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:15px}
#log div{animation:pop .25s}#log b{color:var(--c)}#cf{display:flex;gap:6px}#cf button{border:0;border-radius:12px;background:var(--teal);font-size:20px;padding:0 14px}
.res.win .card{box-shadow:6px 6px 0 var(--teal)}.res.lose .card{box-shadow:6px 6px 0 #ff4d4d}
.vl{list-style:none;padding:0;margin:8px 0 0}.vl li{padding:2px 0}
.rv{background:var(--ink);border-left:8px solid var(--c);border-radius:14px;padding:10px;font-size:14px}.rv ul{padding-left:16px;margin:6px 0 0;font-weight:600}
.rv h4{margin:0;font-size:19px}.big{font-size:30px;text-align:center;margin:0;font-family:'Bagel Fat One';color:var(--brass);animation:wob 3s infinite}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--pink);color:var(--ink);padding:10px 16px;border-radius:14px;z-index:9}
@keyframes wob{50%{transform:rotate(3deg) scale(1.03)}}@keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}
@keyframes pop{from{transform:scale(.6);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script type="module" src="app.js"></script>
</body></html>
